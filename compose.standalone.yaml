# iotwong — 全容器模式（docs/06-deployment.md）。
# 自带 PostgreSQL 18 + PostGIS + TimescaleDB（本地镜像 iotwong/pg18-ext:1.0.0，
# 由 deploy/db/README.md 说明来源与摘要核对），数据库不暴露公网。
#
#   docker compose --env-file .env.standalone -p iotwong-standalone \
#       -f compose.standalone.yaml up -d --build
#
# 服务：db · migrate(一次性) · api · ingestor · mosquitto · web(WEB_PORT→80)

name: iotwong-standalone

services:
  db:
    image: iotwong/pg18-ext:1.0.0
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iotwong_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-iotwong}
      IOTWONG_APP_USER: ${IOTWONG_APP_USER:-iotwong_app}
      IOTWONG_APP_PASSWORD: ${IOTWONG_APP_PASSWORD:?required}
    volumes:
      - ./deploy/db/init-db.sh:/docker-entrypoint-initdb.d/10-iotwong-init.sh:ro
      - pg-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iotwong_owner} -d ${POSTGRES_DB:-iotwong}"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24
    restart: unless-stopped

  migrate:
    image: iotwong-backend:0.1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}", GOSUMDB: "${GOSUMDB:-sum.golang.org}" }
    command: ["sh", "-c",
      "for i in $$(seq 1 30); do /usr/local/bin/migrate --dir /migrations && exit 0; sleep 2; done; echo 'migrate: DB unreachable'; exit 1"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-iotwong}
      PGUSER: ${POSTGRES_USER:-iotwong_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    image: iotwong-backend:0.1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}", GOSUMDB: "${GOSUMDB:-sum.golang.org}" }
    command: ["server"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-iotwong}
      PGUSER: ${IOTWONG_APP_USER:-iotwong_app}
      PGPASSWORD: ${IOTWONG_APP_PASSWORD:?required}
      SESSION_KEY: ${SESSION_KEY:-dev-only-change-me}
      LUATOS_ENABLED: "false"
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  ingestor:
    image: iotwong-backend:0.1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: { GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}", GOSUMDB: "${GOSUMDB:-sum.golang.org}" }
    command: ["ingestor"]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: ${MQTT_INGESTOR_USER:-iotwong_ingestor}
      MQTT_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?required}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-iotwong}
      PGUSER: ${IOTWONG_APP_USER:-iotwong_app}
      PGPASSWORD: ${IOTWONG_APP_PASSWORD:?required}
    depends_on:
      mosquitto: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.21
    environment:
      MQTT_INGESTOR_USER: ${MQTT_INGESTOR_USER:-iotwong_ingestor}
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?required}
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:-dev-1}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:?required}
      MQTT_DEVICE_ID: ${MQTT_DEVICE_ID:-dev-1}
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./.secrets/mqtt:/mosquitto/secret
      - mqtt-data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    restart: unless-stopped

  web:
    image: iotwong-web:0.1.0
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_MAP_PROVIDER: "${VITE_MAP_PROVIDER:-offline}"
        VITE_MAP_KEY: "${VITE_MAP_KEY:-}"

    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  pg-data:
  mqtt-data:
