# iotwong web: static SPA + same-origin /api proxy to the Go API service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api must never fall through to index.html (docs/04-contracts.md)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: disable buffering/cache, allow long reads (outbox stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
    }

    # SPA history fallback: every non-/api GET serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache hashed immutable assets
    location /_app/immutable/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
