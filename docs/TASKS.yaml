  - id: T04
    title: 本地定位完整链路
    status: done
    depends_on: [T02]
    spec: docs/05-implementation-plan.md
    evidence:
      - "MQTT 链：sim-send(dev-1, QoS1) → mosquitto(ACL 只读写各自 topic) → ingestor → DB；ACL 用户名即设备 external_id，topic write 仅本机 topic"
      - "幂等/冲突：同 event 同载荷重发 result=duplicate（0 新增）；同 event 异载荷 result=conflict；positions 无重复行"
      - "乱序/晚到：recorded_at -10min 历史消息入库，device_latest 仍保持最新（前进规则）；future +10min → poison future_too_far=1 不落库"
      - "DB 中断：另启 PGPORT=59999 的 ingestor，收到消息后 'message not acked (will be redelivered)'（不 ACK 未落库）；健康 ingestor 同事件落库一次（rows=1, ledger=ok）"
      - "API：POST /auth/login(Argon2id+HttpOnly cookie) 200；/auth/me 返回 tenant/role=admin；GET /devices 无 cookie 401，登录后 local dev-1 online 含位置/电量，racebox_demo is_demo=true historical；GET /devices?source=local 过滤正常"
      - "SSE：/api/v1/events 从 Last-Event-ID 续传，replay 历史 + 新事件实时（device.updated，id/event/data 行格式）；heartbeat 注释"
      - "seed 幂等：admin/dev-1 仅建一次；go vet/test/build 通过（dbmigrate/httpapi/racebox ok）"
